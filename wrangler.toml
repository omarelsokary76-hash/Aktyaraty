name = "aktyaraty"
main = "worker.js"
compatibility_date = "2026-07-03"

kv_namespaces = [
  { binding = "STORE_KV", id = "0fdabb9050184676ac74e58fc8e60fd4" }
]

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api/*"]

# ===== Cloudflare Images binding - لازم عشان تحويل صور المشاركة (1200×630) وصور الكارت (800×800) يشتغل =====
# ملحوظة: خدمة Cloudflare Images منتج له تكلفة حسب الاستخدام (usage-based)، لازم تفعّله من الداشبورد
# (Images -> Enable) قبل ما الـ binding ده يشتغل، وإلا الكود هيرجع للصورة الأصلية زي ما هي تلقائيًا (fallback آمن)
[images]
binding = "IMAGES"

# ===== R2 Bucket لتخزين صور المتجر (بديل عن الروابط الخارجية) =====
# لازم تنشئ الـ bucket ده من الداشبورد أولاً (R2 -> Create bucket -> اسمه "karystore-images")
[[r2_buckets]]
binding = "STORE_IMAGES"
bucket_name = "karystore-images"

# لوحة التحكم بتستخدم نظام دخول بخطوتين (كلمتين سر منفصلتين)، فلازم تضيف الاتنين كـ Secrets
# من Settings -> Variables and secrets في الداشبورد: ADMIN_HASH (كلمة السر الأولى) و ADMIN_HASH2 (كلمة السر الثانية)
# - من غير الاتنين مع بعض، تسجيل الدخول للوحة التحكم مش هيشتغل خالص.
